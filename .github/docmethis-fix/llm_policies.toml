# Non-secret Fix policy defaults. Select a model supported by the private
# runtime release before running Fix.

[fix.default]
model = "provider/model"
max_attempts = 3
timeout_seconds = 30.0
token_budget = 8000
prompt_variant = "compact"
structured_output_mode = "guided_json"

[fix.default.generation_options]
temperature = 0.0
max_tokens = 8000
